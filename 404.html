<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — /sec/log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ============================================================
           THEME TOKENS (完全复用原风格)
           ============================================================ */
        :root[data-theme="dark"] {
            --bg: #0c0b09;
            --bg-elev: #14120e;
            --bg-elev-2: #1c1a14;
            --fg: #f0ead6;
            --fg-dim: #c9c1ad;
            --muted: #8a8275;
            --accent: #f59e0b;
            --accent-rgb: 245, 158, 11;
            --accent-2: #06b6d4;
            --accent-2-rgb: 6, 182, 212;
            --border: rgba(240, 234, 214, 0.08);
            --border-strong: rgba(240, 234, 214, 0.18);
            --card: #15130e;
            --code-bg: #060503;
            --code-fg: #f0ead6;
            --glow: rgba(245, 158, 11, 0.15);
            --nav-bg: rgba(12, 11, 9, 0.6);
            --nav-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        :root[data-theme="light"] {
            --bg: #f3ecdc;
            --bg-elev: #faf3e1;
            --bg-elev-2: #fffaee;
            --fg: #1a1610;
            --fg-dim: #3d362b;
            --muted: #6b6358;
            --accent: #c2410c;
            --accent-rgb: 194, 65, 12;
            --accent-2: #0e7490;
            --accent-2-rgb: 14, 116, 144;
            --border: rgba(26, 22, 16, 0.12);
            --border-strong: rgba(26, 22, 16, 0.24);
            --card: #fffaee;
            --code-bg: #1a1610;
            --code-fg: #f3ecdc;
            --glow: rgba(194, 65, 12, 0.12);
            --nav-bg: rgba(243, 236, 220, 0.75);
            --nav-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
        }
        :root[data-theme="cyber"] {
            --bg: #02060a;
            --bg-elev: #050d10;
            --bg-elev-2: #071318;
            --fg: #4eff96;
            --fg-dim: #8affb8;
            --muted: #2a8a5e;
            --accent: #ffea00;
            --accent-rgb: 255, 234, 0;
            --accent-2: #ff10f0;
            --accent-2-rgb: 255, 16, 240;
            --border: rgba(78, 255, 150, 0.18);
            --border-strong: rgba(78, 255, 150, 0.4);
            --card: #050d10;
            --code-bg: #000;
            --code-fg: #4eff96;
            --glow: rgba(78, 255, 150, 0.2);
            --nav-bg: rgba(2, 6, 10, 0.8);
            --nav-shadow: 0 4px 30px rgba(78, 255, 150, 0.08);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            overflow-x: hidden;
            position: relative;
            opacity: 0;
            animation: pageFadeIn 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        @keyframes pageFadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        [data-theme="cyber"] body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(78, 255, 150, 0.025) 2px, rgba(78, 255, 150, 0.025) 3px);
            z-index: 200;
            mix-blend-mode: overlay;
        }

        body.theme-anim,
        body.theme-anim *,
        body.theme-anim *::before,
        body.theme-anim *::after {
            transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                fill 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.6s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        .font-display {
            font-family: 'Fraunces', serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* ============================================================
           PROGRESS BAR
           ============================================================ */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            z-index: 100;
            box-shadow: 0 0 12px var(--accent), 0 0 4px var(--accent);
            transition: width 0.1s linear;
        }

        /* ============================================================
           BACKGROUND GRID
           ============================================================ */
        .bg-grid {
            background-image: linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 56px 56px;
            background-position: center center;
        }

        /* ============================================================
           FLOATING DOTS
           ============================================================ */
        .float-dot {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.2;
            pointer-events: none;
            animation: drift 18s ease-in-out infinite;
        }
        .float-dot:nth-child(1) {
            animation-duration: 22s;
            animation-delay: -2s;
        }
        .float-dot:nth-child(2) {
            animation-duration: 16s;
            animation-delay: -6s;
        }
        .float-dot:nth-child(3) {
            animation-duration: 20s;
            animation-delay: -10s;
        }
        .float-dot:nth-child(4) {
            animation-duration: 14s;
            animation-delay: -4s;
        }
        @keyframes drift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(80px, -50px) scale(1.12);
            }
            50% {
                transform: translate(-40px, 60px) scale(0.92);
            }
            75% {
                transform: translate(50px, -30px) scale(1.05);
            }
        }

        /* ============================================================
           MOUSE GLOW
           ============================================================ */
        .mouse-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(var(--accent-rgb), 0.12) 0%, transparent 60%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.4s ease;
            filter: blur(30px);
            z-index: 1;
        }

        /* ============================================================
           TYPEWRITER CURSOR
           ============================================================ */
        .cursor::after {
            content: '▌';
            color: var(--accent);
            animation: blink 1s steps(1) infinite;
            margin-left: 4px;
            font-weight: 400;
        }
        @keyframes blink {
            0%,
            50% {
                opacity: 1;
            }
            51%,
            100% {
                opacity: 0;
            }
        }
        .logo-cursor {
            display: inline-block;
            width: 0.5em;
            height: 1em;
            background: var(--accent);
            margin-left: 3px;
            animation: blink 1.1s steps(1) infinite;
            vertical-align: text-bottom;
        }

        /* ============================================================
           LINKS
           ============================================================ */
        .hover-link {
            position: relative;
            color: var(--fg-dim);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .hover-link:hover {
            color: var(--fg);
        }
        .hover-link::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hover-link:hover::after {
            width: 100%;
        }

        /* ============================================================
           THEME TOGGLE
           ============================================================ */
        .theme-toggle {
            display: inline-flex;
            background: var(--bg-elev);
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            padding: 3px;
            gap: 2px;
            flex-shrink: 0;
        }
        .theme-btn {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--muted);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 12px;
        }
        .theme-btn.active {
            background: var(--accent);
            color: var(--bg);
            box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.5);
        }
        .theme-btn:hover:not(.active) {
            color: var(--fg);
            transform: scale(1.08);
        }

        /* ============================================================
           TAG
           ============================================================ */
        .tag {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            padding: 4px 9px;
            border: 1px solid rgba(var(--accent-rgb), 0.5);
            border-radius: 2px;
            background: rgba(var(--accent-rgb), 0.08);
            font-weight: 500;
            animation: tagPulse 3s ease-in-out infinite;
        }
        @keyframes tagPulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0);
            }
            50% {
                box-shadow: 0 0 12px 2px rgba(var(--accent-rgb), 0.15);
            }
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-primary {
            background: var(--accent);
            color: var(--bg);
            padding: 13px 22px;
            border: none;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -8px rgba(var(--accent-rgb), 0.6);
        }
        .btn-primary:hover::before {
            transform: translateX(100%);
        }
        .btn-primary .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: rippleAnim 0.7s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .btn-secondary {
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--border-strong);
            padding: 13px 22px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.08em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            position: relative;
        }
        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* ============================================================
           NAV
           ============================================================ */
        #nav {
            transition: background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        #nav.scrolled {
            background: var(--bg-elev);
            box-shadow: var(--nav-shadow);
            border-bottom-color: var(--border-strong);
        }

        /* ============================================================
           404 HERO
           ============================================================ */
        .error-code {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: clamp(6rem, 20vw, 14rem);
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--accent);
            text-shadow: 0 0 60px rgba(var(--accent-rgb), 0.2),
                0 0 120px rgba(var(--accent-rgb), 0.08);
            animation: errorPulse 4s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }
        @keyframes errorPulse {
            0%,
            100% {
                text-shadow: 0 0 60px rgba(var(--accent-rgb), 0.2), 0 0 120px rgba(var(--accent-rgb), 0.08);
            }
            50% {
                text-shadow: 0 0 80px rgba(var(--accent-rgb), 0.35), 0 0 160px rgba(var(--accent-rgb), 0.15);
            }
        }

        .error-sub {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.6rem, 4vw, 3.2rem);
            font-weight: 600;
            font-style: italic;
            color: var(--fg);
            margin-top: 4px;
            position: relative;
            z-index: 2;
        }

        .error-desc {
            font-size: clamp(0.95rem, 1.4vw, 1.2rem);
            max-width: 580px;
            color: var(--muted);
            line-height: 1.8;
            margin: 16px auto 32px;
            position: relative;
            z-index: 2;
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .error-404-wrap {
            position: relative;
            display: inline-block;
        }
        .error-404-wrap::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -10%;
            width: 120%;
            height: 140%;
            background: radial-gradient(ellipse at 30% 50%, rgba(var(--accent-rgb), 0.08), transparent 60%);
            filter: blur(50px);
            pointer-events: none;
            animation: titleGlow 6s ease-in-out infinite alternate;
        }
        @keyframes titleGlow {
            0% {
                opacity: 0.4;
                transform: translateX(-10px) scale(1);
            }
            100% {
                opacity: 0.9;
                transform: translateX(20px) scale(1.1);
            }
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 5px;
            border: 2px solid var(--bg);
            transition: background 0.3s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        ::selection {
            background: var(--accent);
            color: var(--bg);
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        footer a {
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }
        footer a:hover {
            color: var(--accent) !important;
            transform: translateY(-1px);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            #nav {
                padding: 12px 16px !important;
            }
            .nav-links {
                gap: 10px !important;
            }
            .nav-links a {
                font-size: 12px !important;
            }
            .theme-btn {
                width: 28px;
                height: 28px;
                font-size: 10px;
            }
            .error-404-wrap::before {
                display: none;
            }
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
            .btn-primary,
            .btn-secondary {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            #nav {
                padding: 10px 12px !important;
            }
            .nav-links {
                gap: 6px !important;
            }
            .nav-links a {
                font-size: 10px !important;
            }
            .theme-btn {
                width: 24px;
                height: 24px;
                font-size: 9px;
            }
            .error-desc {
                padding: 0 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
            body {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .error-code {
                animation: none !important;
                text-shadow: 0 0 60px rgba(var(--accent-rgb), 0.2);
            }
        }
    </style>
</head>
<body>

    <!-- ===== PROGRESS BAR ===== -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- ===== MOUSE GLOW ===== -->
    <div class="mouse-glow" id="mouseGlow"></div>

    <!-- ============================================================
    NAV
    ============================================================ -->
    <nav id="nav" style="position:fixed;top:0;left:0;right:0;z-index:50;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <a href="/" style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;text-decoration:none;color:var(--fg);letter-spacing:-0.03em;display:flex;align-items:center;gap:2px;flex-shrink:0;">
            <span style="color:var(--muted);">/</span>sec<span style="color:var(--muted);">/</span>log
            <span class="logo-cursor"></span>
        </a>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            <div class="nav-links" style="display:flex;align-items:center;gap:18px;font-family:'JetBrains Mono',monospace;font-size:13px;">
                <a href="/" class="hover-link">首页</a>
                <a href="/#directions" class="hover-link">技术方向</a>
                <a href="/#goals" class="hover-link">学习目标</a>
                <a href="/#roadmap" class="hover-link">路线图</a>
                <a href="/#about" class="hover-link">关于</a>
                <a href="https://github.com/Cyph3rLab" target="_blank" rel="noopener" class="social-link" style="border:none;padding:4px 6px;color:var(--muted);text-decoration:none;transition:color 0.3s ease;" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                    <span style="font-size:12px;font-weight:500;">GitHub</span>
                </a>
            </div>
            <div class="theme-toggle" role="group" aria-label="主题切换">
                <button class="theme-btn active" data-theme="dark" title="暗色" aria-label="暗色主题"><i class="fas fa-moon"></i></button>
                <button class="theme-btn" data-theme="light" title="亮色" aria-label="亮色主题"><i class="fas fa-sun"></i></button>
                <button class="theme-btn" data-theme="cyber" title="赛博" aria-label="赛博主题"><i class="fas fa-terminal"></i></button>
            </div>
        </div>
    </nav>

    <!-- ============================================================
    404 HERO
    ============================================================ -->
    <section class="bg-grid" style="flex:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 28px 80px;position:relative;overflow:hidden;text-align:center;">

        <!-- 浮动光点 -->
        <div class="float-dot" style="width:340px;height:340px;background:var(--accent);top:-100px;right:-80px;opacity:0.10;"></div>
        <div class="float-dot" style="width:220px;height:220px;background:var(--accent-2);bottom:30px;left:-50px;opacity:0.07;animation-delay:-6s;"></div>
        <div class="float-dot" style="width:160px;height:160px;background:var(--accent);top:40%;left:60%;opacity:0.05;animation-delay:-12s;"></div>
        <div class="float-dot" style="width:280px;height:280px;background:var(--accent-2);bottom:10%;right:10%;opacity:0.06;animation-delay:-8s;"></div>

        <div style="max-width:900px;margin:0 auto;width:100%;position:relative;z-index:2;">

            <!-- 小标签 -->
            <div style="margin-bottom:24px;">
                <span class="tag">404 — 未找到</span>
            </div>

            <!-- 大号 404 -->
            <div class="error-404-wrap">
                <div class="error-code">404</div>
            </div>

            <!-- 副标题 -->
            <div class="error-sub">
                <span style="color:var(--muted);">$</span>
                <span id="typewriter" class="cursor"></span>
            </div>

            <!-- 描述 -->
            <p class="error-desc">
                你似乎进入了一个不存在的路径。可能是链接已失效，或者页面已被迁移。<br />
                不过没关系，让我们一起回到安全的知识世界吧。
            </p>

            <!-- 操作按钮 -->
            <div class="error-actions">
                <a href="/" class="btn-primary">
                    <i class="fas fa-arrow-left"></i> 返回首页
                </a>
                <a href="https://github.com/Cyph3rLab/Network-Engineering-Notes" target="_blank" rel="noopener" class="btn-secondary">
                    <i class="fab fa-github"></i> 探索项目
                </a>
                <a href="mailto:cyph3r1ab@outlook.com" class="btn-secondary" style="border-color:transparent;">
                    <i class="fas fa-envelope"></i> 联系作者
                </a>
            </div>

            <!-- 额外提示 -->
            <div style="margin-top:48px;padding:16px 24px;background:var(--bg-elev);border:1px solid var(--border);border-radius:4px;display:inline-block;">
                <p style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin:0;letter-spacing:0.04em;">
                    <span style="color:var(--fg);">$</span> echo "从数据包到安全，从协议到防御" 
                    <span style="color:var(--accent);">⏎</span>
                </p>
            </div>

        </div>
    </section>

    <!-- ============================================================
    FOOTER
    ============================================================ -->
    <footer style="padding:32px 28px;border-top:1px solid var(--border);text-align:center;background:var(--bg-elev);">
        <div style="max-width:1000px;margin:0 auto;">

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // TYPEWRITER (404 副标题)
        // ============================================================
        const fallbackLines = [
            "page not found.",
            "route unavailable.",
            "packet lost in transit.",
            "you've reached the void.",
            "let's get you back on track."
        ];
        const typeEl = document.getElementById('typewriter');
        let gIdx = 0,
            cIdx = 0,
            deleting = false;

        function tick404() {
            const current = fallbackLines[gIdx];
            if (deleting) {
                cIdx--;
                typeEl.textContent = current.slice(0, cIdx);
                if (cIdx === 0) {
                    deleting = false;
                    gIdx = (gIdx + 1) % fallbackLines.length;
                    setTimeout(tick404, 400);
                    return;
                }
                setTimeout(tick404, 35);
            } else {
                cIdx++;
                typeEl.textContent = current.slice(0, cIdx);
                if (cIdx === current.length) {
                    deleting = true;
                    setTimeout(tick404, 2000);
                    return;
                }
                setTimeout(tick404, 65 + Math.random() * 50);
            }
        }
        tick404();

        // ============================================================
        // READING PROGRESS BAR
        // ============================================================
        const progressBar = document.getElementById('progressBar');

        function updateProgress() {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            progressBar.style.width = progress + '%';
        }
        window.addEventListener('scroll', updateProgress, { passive: true });
        updateProgress();

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        const themeButtons = document.querySelectorAll('.theme-btn');
        const root = document.documentElement;

        function setTheme(theme, animate = true) {
            if (animate) {
                document.body.classList.add('theme-anim');
                setTimeout(() => document.body.classList.remove('theme-anim'), 700);
            }
            root.setAttribute('data-theme', theme);
            try {
                localStorage.setItem('sec-log-theme', theme);
            } catch (e) {}
            themeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        themeButtons.forEach(btn => {
            btn.addEventListener('click', () => setTheme(btn.dataset.theme));
        });

        let initialTheme = 'dark';
        try {
            const saved = localStorage.getItem('sec-log-theme');
            if (saved && ['dark', 'light', 'cyber'].includes(saved)) initialTheme = saved;
        } catch (e) {}
        setTheme(initialTheme, false);

        // ============================================================
        // MOUSE GLOW
        // ============================================================
        const mouseGlow = document.getElementById('mouseGlow');
        const heroSection = document.querySelector('section.bg-grid');
        if (heroSection) {
            heroSection.addEventListener('mousemove', (e) => {
                const rect = heroSection.getBoundingClientRect();
                mouseGlow.style.left = (e.clientX - rect.left) + 'px';
                mouseGlow.style.top = (e.clientY - rect.top) + 'px';
                mouseGlow.style.opacity = '1';
            });
            heroSection.addEventListener('mouseleave', () => {
                mouseGlow.style.opacity = '0';
            });
        }

        // ============================================================
        // KEYBOARD SHORTCUT: T
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 't' || e.key === 'T') {
                const current = root.getAttribute('data-theme');
                const order = ['dark', 'light', 'cyber'];
                const next = order[(order.indexOf(current) + 1) % order.length];
                setTheme(next);
            }
        });

        // ============================================================
        // BG GRID PARALLAX
        // ============================================================
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            const heroGrid = heroSection;
            if (heroGrid && scrolled < window.innerHeight) {
                heroGrid.style.backgroundPosition = `center ${scrolled * 0.3}px`;
            }
        }, { passive: true });

        // ============================================================
        // NAV SCROLL EFFECT
        // ============================================================
        const nav = document.getElementById('nav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 60) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        }, { passive: true });

        // ============================================================
        // BUTTON RIPPLE
        // ============================================================
        document.querySelectorAll('.btn-primary').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);
            });
        });

        // ============================================================
        // SMOOTH NAV ANCHOR SCROLL (for internal links)
        // ============================================================
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    e.preventDefault();
                    const navHeight = document.getElementById('nav').offsetHeight + 16;
                    const targetPos = target.getBoundingClientRect().top + window.scrollY - navHeight;
                    window.scrollTo({ top: targetPos, behavior: 'smooth' });
                }
            });
        });

        console.log('🔒 /sec/log · 404 页面已加载');
        console.log('⌨️  按 T 键切换主题');
        console.log('🔄 页面未找到，但知识永远在路上');
    </script>
</body>
